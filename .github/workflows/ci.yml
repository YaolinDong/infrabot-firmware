# SPDX-License-Identifier: Apache-2.0
name: Firmware checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release contents and reachable history
        if: github.repository == 'YaolinDong/infrabot-firmware'
        run: tools/prepublish_check.sh --history
      - name: Check release allowlist in development checkouts
        if: github.repository != 'YaolinDong/infrabot-firmware'
        run: tools/prepublish_check.sh --manifest-only

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [Release, Debug, StandaloneDebug]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib ninja-build
      - run: cmake --preset "${{ matrix.preset }}" && cmake --build --preset "${{ matrix.preset }}" --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.preset }}
          if-no-files-found: error
          path: |
            build/${{ matrix.preset }}/*.bin
            build/${{ matrix.preset }}/*.map

  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/run_host_tests.sh
      - run: tests/run_host_tests.sh
        env:
          CFLAGS_EXTRA: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -no-pie

  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_layers.py
      - run: python3 tools/check_config_macros.py --before tests/data/app_config_before.h
      - run: python3 tools/gen_lcd_zh_font.py --check
